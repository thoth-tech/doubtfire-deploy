name: Validate secret audit tool
on:
  pull_request:
    paths:
      - tools/audit-vapid-secret.py
      - tools/tests/test_audit_vapid_secret.py
      - .github/workflows/validate-secret-audit.yml
  push:
    branches: ["11.0.x"]
    paths:
      - tools/audit-vapid-secret.py
      - tools/tests/test_audit_vapid_secret.py
      - .github/workflows/validate-secret-audit.yml
permissions:
  contents: read
jobs:
  synthetic-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -B -m unittest discover -s tools/tests -p 'test_audit_vapid_secret.py'
