services:
  dev-db:
    container_name: df-compose-dev-db
    # Kept identical to docker-compose.yml. Both share the db_data volume, so
    # they must agree on the server version and on the mount.
    image: mariadb:12.3
    environment:
      MYSQL_ROOT_PASSWORD: db-root-password
      MYSQL_DATABASE: doubtfire-dev
      MYSQL_USER: dfire
      MYSQL_PASSWORD: pwd
    volumes:
      # Named volume, not ../data/database. See the comment in
      # docker-compose.yml for why a bind mount breaks InnoDB on Windows.
      - db_data:/var/lib/mysql

  doubtfire-api:
    container_name: doubtfire-api
    image: lmsdoubtfire/doubtfire-api:11.0.x-dev
    build: ../doubtfire-api
    ports:
      - "3000:3000"
    volumes:
      - ../doubtfire-api/:/doubtfire
      - ../data/tmp:/doubtfire/tmp
      - ../data/student-work:/student-work
    depends_on:
      - dev-db
    environment:
      RAILS_ENV: 'development'

      DF_STUDENT_WORK_DIR: /student-work
      DF_INSTITUTION_HOST: http://localhost:3000
      DF_INSTITUTION_PRODUCT_NAME: OnTrack

      DF_SECRET_KEY_BASE: test-secret-key-test-secret-key!
      DF_SECRET_KEY_ATTR: test-secret-key-test-secret-key!
      DF_SECRET_KEY_DEVISE: test-secret-key-test-secret-key!

      # Database authentication is the safe local default. Optional AAF values
      # must come from an ignored development/.env file.
      DF_AUTH_METHOD: ${DF_AUTH_METHOD:-database}
      DF_AAF_ISSUER_URL: ${DF_AAF_ISSUER_URL:-}
      DF_AAF_AUDIENCE_URL: ${DF_AAF_AUDIENCE_URL:-http://localhost:3000}
      DF_AAF_CALLBACK_URL: ${DF_AAF_CALLBACK_URL:-http://localhost:3000/api/auth/jwt}
      DF_AAF_IDENTITY_PROVIDER_URL: ${DF_AAF_IDENTITY_PROVIDER_URL:-}
      DF_AAF_UNIQUE_URL: ${DF_AAF_UNIQUE_URL:-}
      DF_AAF_AUTH_SIGNOUT_URL: ${DF_AAF_AUTH_SIGNOUT_URL:-}
      DF_SECRET_KEY_AAF: ${DF_SECRET_KEY_AAF:-}

      # Peer Progress Indicator local defaults, aligned with production policy.
      DF_PPI_MINIMUM_COHORT_SIZE: '21'
      DF_PPI_STALE_AFTER_HOURS: '48'

      # Database settings - for development env
      DF_DEV_DB_ADAPTER: mysql2
      DF_DEV_DB_HOST: df-compose-dev-db
      DF_DEV_DB_DATABASE: doubtfire-dev
      DF_DEV_DB_USERNAME: dfire
      DF_DEV_DB_PASSWORD: pwd

      # Database settings - for test env
      DF_TEST_DB_ADAPTER: mysql2
      DF_TEST_DB_HOST: df-compose-dev-db
      DF_TEST_DB_DATABASE: doubtfire-dev
      DF_TEST_DB_USERNAME: dfire
      DF_TEST_DB_PASSWORD: pwd

      # Database settings - for test env
      DF_PRODUCTION_DB_ADAPTER: mysql2
      DF_PRODUCTION_DB_HOST: df-compose-dev-db
      DF_PRODUCTION_DB_DATABASE: doubtfire-dev
      DF_PRODUCTION_DB_USERNAME: dfire
      DF_PRODUCTION_DB_PASSWORD: pwd

      # Overseer - disabled!
      OVERSEER_ENABLED: 1
      TUTORIAL_ENABLED: ${TUTORIAL_ENABLED:-0}
      RABBITMQ_HOSTNAME: doubtfire-mq
      RABBITMQ_USERNAME: secure_credentials
      RABBITMQ_PASSWORD: secure_credentials
      DOCKER_HOST: host.docker.internal

      # Turn It In
      TII_ENABLED: false

      # Redis
      DF_REDIS_SIDEKIQ_URL: redis://doubtfire-redis-sidekiq:6379/0

  doubtfire-web:
    container_name: doubtfire-web
    image: lmsdoubtfire/doubtfire-web:11.0.x-dev
    build: ../doubtfire-web
    command: /bin/bash -c 'npm install && npm start'
    ports:
      - "4200:4200"
    depends_on:
      - doubtfire-api
    volumes:
      - ../doubtfire-web:/doubtfire-web
      - ./proxy.conf.docker.json:/doubtfire-web/proxy.conf.json:ro

  overseer-receive:
    image: lmsdoubtfire/doubtfire-api:11.0.x-dev
    build: ../doubtfire-api
    env_file:
      - api.env
      - overseer.env
    volumes:
      - ../doubtfire-api/:/doubtfire
      - ../data/tmp:/doubtfire/tmp
      - ../data/student-work:/student-work
    command: /bin/bash -c "bundle exec rake register_q_assessment_results_subscriber"

  overseer-worker-1:
    build: ../doubtfire-overseer
    env_file:
      - api.env
      - overseer.env
    environment:
      DOCKER_HOST: host.docker.internal
      CONTAINER_NAME: overseer-container-1
      HOST_XFS_VOLUME: $PWD/../data/overseer-instances/1
    volumes:
      - ../doubtfire-overseer/:/app
      # Host path for writing the output of execution - required.
      # TODO: Test by mounting an actual XFS volume.
      # /stage/ontrack-overseer-[1-4]
      - ../data/overseer-instances/1:/home/overseer/work-dir
      # Path for reading OnTrack files from - required.
      # TODO: Map this directly to a constant path that can be written to,
      # as the path will be a part of the messages
      # received from OnTrack via RabbitMQ.
      # TODO: Make the path rw by overseer in docker image.
      - ../data/student-work:/student-work
    command: /bin/bash -c "bundle exec ruby ./app.rb"

  doubtfire-mq:
    container_name: df-rabbitmq
    image: rabbitmq:3.8-management
    ports:
      - 15672:15672
    volumes:
      - ../data/rabbitmq/data/:/var/lib/rabbitmq
      - ../data/rabbitmq/log/:/var/log/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: secure_credentials
      RABBITMQ_DEFAULT_PASS: secure_credentials

volumes:
  db_data:
