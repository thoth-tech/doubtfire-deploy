global
  log stdout format raw local0
  maxconn 64

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 1h
  timeout server 1h
  timeout tunnel 1h

frontend docker_api
  bind :2375

  acl safe_read method GET HEAD
  acl safe_write method POST
  acl ping_path path_reg ^(/v[0-9.]+)?/_ping$
  acl version_path path_reg ^(/v[0-9.]+)?/version$
  acl helper_inspect_path path_reg ^(/v[0-9.]+)?/containers/(jplag|__PROJECT_NAME__-texlive-(pdfgen|sidekiq))/json$
  acl helper_exec_path path_reg ^(/v[0-9.]+)?/containers/(jplag|__PROJECT_NAME__-texlive-(pdfgen|sidekiq))/exec$
  acl exec_inspect_path path_reg ^(/v[0-9.]+)?/exec/[0-9a-f]{64}/json$
  acl exec_action_path path_reg ^(/v[0-9.]+)?/exec/[0-9a-f]{64}/(start|resize)$

  http-request allow if safe_read ping_path
  http-request allow if safe_read version_path
  http-request allow if safe_read helper_inspect_path
  http-request allow if safe_read exec_inspect_path
  http-request allow if safe_write helper_exec_path
  http-request allow if safe_write exec_action_path
  http-request deny deny_status 403

  default_backend docker_engine

backend docker_engine
  option httpchk
  http-check connect
  http-check send meth GET uri /_ping
  server docker /var/run/docker.sock check inter 5s
